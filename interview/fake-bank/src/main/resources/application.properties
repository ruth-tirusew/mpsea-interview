spring.application.name=fake-bank
server.port=9090
server.tomcat.threads.max=400

# Section IV rates. Override via env (BANK_ACCEPT_RATE=0 ...) or POST /bank/admin/config at runtime (B2).
bank.accept-rate=0.80
bank.reject-rate=0.08
bank.no-response-rate=0.12
bank.no-response-processed-rate=0.5
bank.callback-fail-rate=0.05
bank.duplicate-callback-rate=0.30
bank.submit-latency-min=2s
bank.submit-latency-max=6s
bank.status-latency-min=1s
bank.status-latency-max=3s
bank.hang=60s
bank.callback-delay-min=1s
bank.callback-delay-max=10s
bank.callback-urls=http://localhost:8081/mpesa/v1/callbacks/bank,http://localhost:8082/mpesa/v1/callbacks/bank
