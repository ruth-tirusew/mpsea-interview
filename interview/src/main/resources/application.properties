spring.application.name=wallet-service
server.port=${PORT:8081}

server.tomcat.threads.max=50
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=2000

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/interview_db}
spring.datasource.username=${DB_USER:interview_user}
spring.datasource.password=${DB_PASSWORD:interview_pass}

spring.flyway.enabled=true
spring.jackson.default-property-inclusion=non_null

# --- app ---
wallet.instance-id=${INSTANCE_ID:local-${server.port}}
wallet.bank.base-url=${BANK_URL:http://localhost:9090}
wallet.bank.submit-timeout=8s
wallet.idempotency.retention=24h

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=100

# --- security ---
# Comma-separated API keys. No defaults: the service refuses to start without them.
wallet.security.user-keys=${WALLET_USER_API_KEYS:}
wallet.security.admin-keys=${WALLET_ADMIN_API_KEYS:}
wallet.security.callback.secret=${BANK_CALLBACK_SECRET:}
wallet.security.callback.tolerance=5m
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
